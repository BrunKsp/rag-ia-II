services:
  mongodb:
    image: mongo:7
    container_name: rag_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: rag
      MONGO_INITDB_ROOT_PASSWORD: rag123
      MONGO_INITDB_DATABASE: rag_tabua_risco
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:1
    container_name: rag_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: rag
      ME_CONFIG_MONGODB_ADMINPASSWORD: rag123
      ME_CONFIG_MONGODB_URL: mongodb://rag:rag123@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb

volumes:
  mongo_data:
